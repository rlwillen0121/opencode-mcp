[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-mcp"
version = "0.1.0"
description = "Asynchronous MCP dispatcher for OpenCode coding jobs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OpenCode MCP contributors" }]

[project.scripts]
opencode-mcp = "opencode_mcp.server:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
